name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            generator: ""                # Visual Studio (multi-config)
            pluginval_zip: pluginval_Windows.zip
            pluginval_bin: pluginval.exe
          - name: macos
            os: macos-latest
            generator: "-G Ninja"
            pluginval_zip: pluginval_macOS.zip
            pluginval_bin: pluginval.app/Contents/MacOS/pluginval
          - name: linux
            os: ubuntu-latest
            generator: "-G Ninja"
            pluginval_zip: pluginval_Linux.zip
            pluginval_bin: pluginval

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libasound2-dev libjack-jackd2-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxi-dev \
            libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev libgl1-mesa-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Cache JUCE checkout
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('cmake/JUCE.cmake') }}

      - name: Configure
        run: cmake -S . -B build ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit + host tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect plugins
        shell: bash
        run: |
          mkdir -p dist
          for p in Strata VoxNote Intone Ducker; do
            cmake -E copy_directory "build/plugins/$p/${p}_artefacts/Release/VST3/$p.vst3" "dist/$p.vst3"
          done
          ls -R dist | head -50

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: for b in dist/*.vst3; do codesign --force --deep -s - "$b"; done

      - name: Download pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval_zip }}"
          mkdir -p pluginval && cd pluginval && unzip -q ../pluginval.zip

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          for p in Strata VoxNote Intone Ducker; do
            echo "== $p"
            "pluginval/${{ matrix.pluginval_bin }}" --strictness-level 10 --skip-gui-tests \
              --validate-in-process --timeout-ms 300000 --validate "dist/$p.vst3"
          done

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: vst3-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip per platform
        run: |
          cd artifacts
          for d in vst3-*; do (cd "$d" && zip -qr "../${d}-${GITHUB_REF_NAME}.zip" .); done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
