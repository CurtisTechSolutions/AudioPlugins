# Continuous integration: every push to main and every pull request builds and
# tests all plugins on Windows, macOS and Linux (no LTO, compiler-cached), and
# uploads the VST3 zips as run artifacts for 14 days.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/dependabot.yml"
      - ".github/workflows/pr-title.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/dependabot.yml"
      - ".github/workflows/pr-title.yml"
  workflow_dispatch:

concurrency:
  # One run per branch/PR; a newer push cancels the older run (but never on main).
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  label:
    name: Version label
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.v.outputs.label }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "label=$(tr -d '[:space:]' < version.txt)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: label
    uses: ./.github/workflows/build-plugins.yml
    with:
      lto: false
      label: ${{ needs.label.outputs.label }}
      retention-days: 14

  package:
    name: Package check
    # Rehearses the release "publish" job on every CI run: same download pattern,
    # contents check, checksums. Only `gh release upload` is release-only.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: AudioPlugins-*
          merge-multiple: true
          path: assets
          # The artifacts are already zips (uploaded with archive: false); without
          # this, download-artifact would extract them into one merged folder.
          skip-decompress: true
      - name: Verify zip contents
        working-directory: assets
        run: |
          ls -la
          test "$(ls AudioPlugins-*.zip | wc -l)" -eq 3 || { echo "expected 3 platform zips"; exit 1; }
          for z in AudioPlugins-*.zip; do
            # Normalise separators (7-Zip on Windows) and any ./ prefix before matching.
            listing=$(unzip -Z1 "$z" | sed -e 's#\\#/#g' -e 's#^\./##')
            for f in Strata VoxNote Intone Ducker Frisson Humline; do
              grep -q "^$f\.vst3/" <<< "$listing" || { echo "$z is missing $f.vst3"; exit 1; }
            done
            grep -qx "INSTALL.txt" <<< "$listing" || { echo "$z is missing INSTALL.txt"; exit 1; }
            echo "ok  $z ($(wc -l <<< "$listing") entries)"
          done
      - name: Checksums
        working-directory: assets
        run: sha256sum AudioPlugins-*.zip | tee SHA256SUMS.txt
