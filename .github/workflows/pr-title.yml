# PR titles become the squash-merge commit message, which release-please reads
# to decide version bumps and changelog entries — so they must follow
# Conventional Commits: feat: …, fix: …, perf: …, docs: …, ci: …, chore: …
# (feat!: or a "BREAKING CHANGE:" footer for breaking changes).

name: PR title

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          # Scopes are optional; use a plugin name when it helps: feat(frisson): …
          requireScope: false
